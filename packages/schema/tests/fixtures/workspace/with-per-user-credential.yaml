# Two kinds of connection in one workspace — the realistic shape for an agent deployed for a team.
#
# `github` is `global` by omission: a machine token set up once, used by every run.
# `google-calendar` is `per-user`: each run resolves the token belonging to whoever authenticated
# it, so one deployed agent reaches each caller's own calendar and nobody else's.
# See design/details/per-caller-credential-delegation.md.
apiVersion: swarmkit/v1
kind: Workspace
metadata:
  id: team-assistant
  name: Team Assistant
governance:
  provider: mock
  policy_language: yaml
credentials:
  github:
    source: env
    config:
      env: GITHUB_TOKEN
  google-calendar:
    source: oauth
    identity: per-user
    config:
      endpoint: https://mcp.example.com/google
mcp_servers:
  - id: github
    transport: http
    endpoint: https://api.githubcopilot.com/mcp/
    credentials_ref: github
    permission: readonly
  - id: google-calendar
    transport: http
    endpoint: https://mcp.example.com/google
    credentials_ref: google-calendar
    permission: cautious
