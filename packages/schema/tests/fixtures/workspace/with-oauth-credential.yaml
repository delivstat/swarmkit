# An OAuth credential is a reference like every other: the token lives encrypted in the runtime's
# own store, obtained by logging in once. See design/details/mcp-oauth.md.
apiVersion: swarmkit/v1
kind: Workspace
metadata:
  id: oauth-demo
  name: OAuth Demo
governance:
  provider: mock
  policy_language: yaml
credentials:
  linear:
    source: oauth
    config:
      endpoint: https://mcp.linear.app/mcp
      owner: srijith@delivstat.com
mcp_servers:
  - id: linear
    transport: http
    endpoint: https://mcp.linear.app/mcp
    credentials_ref: linear
    permission: cautious
