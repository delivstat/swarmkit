# Exercises the explicit skill ↔ credential link (design/details/skill-requires-credentials.md).
# The runtime builds a reverse credential_id → skills index from this field; the Connections
# page surfaces 'Used by N skills' per credential and warns before disconnect.
apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: gmail-draft-reply
  name: Gmail — Draft Reply
  description: Drafts a reply to a Gmail thread using the gmail MCP server.
category: capability
implementation:
  type: mcp_tool
  server: gmail
  tool: draft_reply
requires_credentials:
  - gmail
provenance:
  authored_by: human
  version: 1.0.0
