# `identity: per-user` derives the owner from the run's authenticated caller, so naming a literal
# owner contradicts it. Guessing which one wins is how a privilege escalation ships, so the schema
# refuses the pair. See design/details/per-caller-credential-delegation.md.
apiVersion: swarmkit/v1
kind: Workspace
metadata:
  id: contradictory
  name: Contradictory
credentials:
  google-calendar:
    source: oauth
    identity: per-user
    config:
      endpoint: https://mcp.example.com/google
      owner: alice@example.com
