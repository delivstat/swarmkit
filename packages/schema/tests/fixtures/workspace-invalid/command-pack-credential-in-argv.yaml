# A credential may only reach a command through the pack's `env`. In argv it would be
# model-placeable, land in the audit line recording what ran, and be readable from `ps`.
apiVersion: swarmkit/v1
kind: Workspace
metadata:
  id: bad-credential-placement
  name: Bad Credential Placement
command_packs:
  - id: github
    credentials_ref: gh-token
    commands:
      - id: list-prs
        argv: [gh, '--token', '{credential.gh-token}', 'pr', 'list']
        effects: read
