# validate.slice_budget.max_diff_lines must be >= 1 — a budget of 0 is rejected.
apiVersion: swarmkit/v1
kind: Funnel
metadata:
  id: bad-slice-budget
  name: Bad slice budget
  description: A funnel whose validate.slice_budget.max_diff_lines violates the minimum of 1.
validate:
  slice_budget:
    max_diff_lines: 0
approve:
  rules:
    - scope: x:approve
      roles: [lead]
      quorum: all
provenance:
  authored_by: human
  version: 1.0.0
