apiVersion: swarmkit/v1
kind: ExecutorAdapter
metadata:
  id: gemini-cli
  name: Gemini CLI
  description: >-
    EXPERIMENTAL (not yet verified against a real binary). Google's Gemini CLI, run
    non-interactively with streaming JSON output. The event map reflects Gemini CLI's line-delimited
    event stream; verify and tune the field paths against your installed version before relying on it.
spec:
  launch:
    command:
      - gemini
      - --output-format
      - stream-json
      - --prompt
      - "{task.statement}"
    optional_args:
      - when: config.model
        args: [--model, "{config.model}"]
  auth:
    default: subscription
    modes:
      api_key:
        env:
          GEMINI_API_KEY: "{credential.model_provider}"
      subscription:
        credential_paths:
          - ~/.gemini
  stream:
    format: jsonl
  event_map:
    - when: { type: session }
      set: { session_id: "$.sessionId" }
    - when: { type: content }
      emit:
        - event: message
          with: { role: assistant, text: "$.text" }
    - when: { type: tool_call }
      emit:
        - event: tool_call
          with: { tool: "$.name", input_summary: "$.args" }
    # The OUTCOME of a tool call comes back as its own event. Unmapped, the trace showed that
    # Gemini called a tool and never whether the tool succeeded — a failed read looked like a
    # good one. `tool_status_map` is separate from `status_map` (which classifies the RUN's
    # terminal status) because the two vocabularies are not the same alphabet.
    - when: { type: tool_call_response }
      emit:
        - event: tool_call
          with:
            tool: "$.name"
            status: { from: "$.status", map: tool_status_map }
            input_summary: "$.response"
    - when: { type: usage }
      emit:
        - event: usage
          with:
            input_tokens: "$.promptTokenCount"
            output_tokens: "$.candidatesTokenCount"
    - when: { type: result }
      emit:
        - event: result
          with:
            status: { from: "$.status", map: status_map }
            output: "$.response"
  status_map:
    success: success
    error: failure
    _default: failure
  tool_status_map:
    success: ok
    error: error
    _default: ""

  success_when: { exit_code: 0 }
  on_unanswerable: abort
  telemetry_grade: normalized
  artifacts: { profile: files }
provenance:
  authored_by: human
  version: 0.1.0
  vendor: google
