    # default.
    output_schema: null
    prompt:
      # TODO(#1045 PR-2): port the `skill` prompt from
      # packages/runtime/src/swarmkit_runtime/authoring/_prompts.py verbatim.
      # Keeping a stub here so the file is schema-valid for PR 1 (foundation).
      system: |
        [stub] SwarmKit `skill` authoring prompt. Full text ports from
        authoring/_prompts.py in the CLI-shim PR (#1045 PR-2).
