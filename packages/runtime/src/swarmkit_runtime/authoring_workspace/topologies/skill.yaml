apiVersion: swarmkit/v1
kind: Topology
metadata:
  name: swarmkit:author:skill
  version: 0.1.0
  description: >
    Bundled authoring topology for `skill` mode. Reached via the reserved
    `swarmkit:author:skill` namespace from any user workspace.
agents:
  root:
    id: root
    role: root
    archetype: topology-author
    # Conversational agent — correctness lands through the write-file tool call, not
