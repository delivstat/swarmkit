apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: read-workspace
  name: Read Workspace
  description: >
    Returns the target workspace's workspace.yaml text + a per-kind inventory of
    top-level YAMLs (topologies, archetypes, skills, funnels). Call this at the start
    of a session to avoid proposing an artifact that already exists.
category: capability
inputs:
  type: object
  additionalProperties: false
  properties: {}
outputs:
  type: object
  required: [target_workspace, workspace_yaml, topologies, archetypes, skills, funnels]
  properties:
    target_workspace: { type: string }
    workspace_yaml:
      type: string
      description: Content of workspace.yaml, or empty if missing.
    topologies:
      type: array
      items: { type: string }
    archetypes:
      type: array
      items: { type: string }
    skills:
      type: array
      items: { type: string }
    funnels:
      type: array
      items: { type: string }
implementation:
  type: command
  pack: author-tools
  command: read-workspace
provenance:
  authored_by: human
  version: 0.1.0
