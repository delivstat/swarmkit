apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: validate-workspace
  name: Validate Workspace
  description: >
    Runs the canonical workspace resolver + schema validator against the target
    workspace and returns a structured summary. Call after writing files to confirm
    the generated set is consistent (topology references resolve, archetype skill
    references exist, workspace.yaml is well-formed).
category: capability
inputs:
  type: object
  additionalProperties: false
  properties: {}
outputs:
  type: object
  required: [target_workspace, valid, counts, errors]
  properties:
    target_workspace: { type: string }
    valid: { type: boolean }
    counts:
      type: object
      additionalProperties: { type: integer }
    errors:
      type: array
      items:
        type: object
        required: [message]
        properties:
          message: { type: string }
          suggestion: { type: string }
implementation:
  type: command
  pack: author-tools
  command: validate-workspace
provenance:
  authored_by: human
  version: 0.1.0
