apiVersion: swarmkit/v1
kind: Workspace
metadata:
  id: swarmkit-author
  name: SwarmKit authoring workspace (bundled)
  description: >
    Ships inside the swarmkit-runtime package. Not run directly — surfaced from a user
    workspace via the reserved `swarmkit:author:*` namespace. See
    design/details/author-bundled-workspace.md (#1045).

    Composition at run time:
      - This workspace supplies: topologies, archetypes, author-local skills, author
        command_packs.
      - The serving / CLI-target workspace supplies: model_providers, credentials,
        governance config, env, and the target for the `write-file` skill (IAM-scoped).

# Memory off: the bundled authoring workspace is shared across every authoring run
# from any target. If memory were on, turn 1 of session A's "I'm writing a URL
# summariser" would leak into turn 1 of session B's "I'm writing a sentiment check"
# — the model would start proposing a URL-summarise-shaped sentiment check. Each
# authoring session threads its own LangGraph checkpointer state via thread_id for
# in-session resume; cross-session memory is not what we want here.
memory:
  enabled: false

# Author command pack. Resolves the target workspace from the context the CLI/serve
# threads in (SWARMKIT_AUTHOR_TARGET_WORKSPACE), so the same bundled workspace writes
# into whichever workspace the author was invoked from.
command_packs:
  - id: author-tools
    description: >
      Local commands the authoring archetypes use. Each command reads the target
      workspace from SWARMKIT_AUTHOR_TARGET_WORKSPACE (set by the CLI shim / serve
      invocation) so one bundled workspace authors into any user workspace.
    permission: open
    # cwd is set via SWARMKIT_AUTHOR_BUNDLED_ROOT, exported by the bundled runtime
    # factory in _workspace_runtime._bundled_authoring_runtime. The compiler does
    # not thread workspace_root through _run_tool_loop -> execute_skill, so a
    # fallback-to-process-cwd would look for the scripts in /home/<user>/wherever
    # the operator ran `swarmkit author` from. Env var is the shortest safe fix.
    # `{WORKSPACE}/...` would be treated as a tool parameter the LLM must supply.
    cwd: ${SWARMKIT_AUTHOR_BUNDLED_ROOT}
    commands:
      - id: write-file
        description: >
          IAM-scoped write into the target workspace's topologies/, skills/,
          archetypes/, funnels/, or workspace.yaml. Rejects paths outside those roots.
        argv:
          - python3
          - command_packs/author-tools/write_file.py
        effects: write
        output:
          parse: json
      - id: read-workspace
        description: Returns a summary of the target workspace's current contents.
        argv:
          - python3
          - command_packs/author-tools/read_workspace.py
        effects: read
        output:
          parse: json
      - id: validate-workspace
        description: Runs the schema validator against the target workspace.
        argv:
          - python3
          - command_packs/author-tools/validate_workspace.py
        effects: read
        output:
          parse: json
      - id: search-skills-catalogue
        description: Looks up a bundle in the swarmkit-skills catalogue by name or capability.
        argv:
          - python3
          - command_packs/author-tools/search_skills_catalogue.py
        effects: read
        output:
          parse: json
