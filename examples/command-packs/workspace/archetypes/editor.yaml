apiVersion: swarmkit/v1
kind: Archetype
metadata:
  id: editor
  name: JSON Editor
  description: Holds the write command, which is gated at `strict`.
role: worker
defaults:
  model:
    provider: anthropic
    name: claude-sonnet-4-6
  prompt:
    system: |
      You modify JSON files on request. The rewrite skill is gated — a human
      approves each call.
  skills:
    - pack:json-tools              # the reads, in bulk
    - json-editing-rewrite         # the write, named explicitly — bulk grants never carry one
provenance:
  authored_by: human
  version: 1.0.0
