apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: git-diff
  name: Git Diff
  description: Returns the diff of the working tree or between refs. A diff is the
    smallest complete description of a change, which makes it the right input for
    any review skill.
category: capability
implementation:
  type: mcp_tool
  server: git
  tool: git_diff
iam:
  required_scopes:
  - workspace:read
provenance:
  authored_by: human
  version: 1.0.0
  requires_runtime: '>=1.199.0'
  registry: swarmkit-skills
