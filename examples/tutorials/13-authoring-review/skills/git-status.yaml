apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: git-status
  name: Git Status
  description: Shows the working tree status. Tells an agent what has changed before
    it changes more — the difference between a review of your diff and a review of
    the whole repository.
category: capability
implementation:
  type: mcp_tool
  server: git
  tool: git_status
iam:
  required_scopes:
  - workspace:read
provenance:
  authored_by: human
  version: 1.0.0
  requires_runtime: '>=1.199.0'
  registry: swarmkit-skills
