apiVersion: swarmkit/v1
kind: Funnel
metadata:
  id: release-approval
  name: Release sign-off
  description: >
    The human gate. The run parks here — checkpointed, nothing resident — until a person with
    release:approve decides. `release:approve` is conferred by a role, never by an agent.
approve:
  rules:
    - scope: release:approve
      roles: [release-manager]
      quorum: all
provenance: {authored_by: human, version: 1.0.0}
