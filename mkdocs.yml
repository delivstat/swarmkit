docs_dir: docs/site
site_dir: _site
site_name: SwarmKit
site_description: SwarmKit is the open-source AI platform runtime — governed AI systems, from a single agent to a multi-agent swarm, defined as data and run under real gates.
site_url: https://delivstat.github.io/swarmkit/
repo_url: https://github.com/delivstat/swarmkit
repo_name: delivstat/swarmkit

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
  features:
    - navigation.sections
    - navigation.expand
    - search.highlight
    - content.code.copy

