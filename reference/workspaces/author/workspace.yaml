apiVersion: swarmkit/v1
kind: Workspace
metadata:
  id: author
  name: Dot Author workspace
  description: >
    A thin SwarmKit workspace whose only job is wrapping existing topologies as Dots.
    Topology authoring itself lives in `swarmkit author` (per-mode system prompts
    + schema knowledge in packages/runtime/src/swarmkit_runtime/authoring/) — this
    workspace does not replicate that. Consumers (the dots app, etc.) invoke the
    `author` topology over AG-UI like any other Dot.

command_packs:
  - id: author-tools
    description: >
      The one local command the Dot Author uses. `create-dot` writes a Dot entry
      pointing at a topology that must already exist in AUTHOR_TARGET_WORKSPACE.
    permission: open
    # cwd uses ${SWARMKIT_WORKSPACE} so relative argv entries resolve regardless of
    # where the swarmkit process is launched from. The compose env sets this to the
    # mounted workspace path.
    cwd: ${SWARMKIT_WORKSPACE}/command_packs/author-tools
    # Argv placeholders ({name}) are filled from the skill's input JSON; SwarmKit does
    # not pipe stdin to command subprocesses, so every field rides on argv.
    commands:
      - id: create-dot
        description: Writes a Dot sidebar entry pointing at an existing topology.
        argv:
          - python3
          - create_dot.py
          - "{id}"
          - "{name}"
          - "{role}"
          - "{greeting}"
          - "{icon}"
          - "{topology}"
          - "{renderers}"
        effects: write
        output:
          parse: json
