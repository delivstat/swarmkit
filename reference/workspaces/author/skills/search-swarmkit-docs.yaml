apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: search-swarmkit-docs
  name: Search SwarmKit docs
  description: >
    Returns matching chunks of SwarmKit's llms-full.txt for a short query. The author
    calls this before guessing — the doc is authoritative, the agent's training data
    may be out of date. Keyword-based substring/token match for now; swap in a
    retrieval backend later without changing the skill shape.
category: capability
inputs:
  type: object
  additionalProperties: false
  required: [query]
  properties:
    query:
      type: string
      description: Short free-text query (e.g. "output_schema path", "openrouter provider shape", "funnel validate").
    max_results:
      type: integer
      minimum: 1
      maximum: 10
      default: 3
outputs:
  type: object
  required: [results]
  properties:
    results:
      type: array
      items:
        type: object
        required: [heading, excerpt]
        properties:
          heading: { type: string }
          excerpt: { type: string }
implementation:
  type: command
  pack: author-tools
  command: search-swarmkit-docs
provenance:
  authored_by: human
  version: 0.1.0
