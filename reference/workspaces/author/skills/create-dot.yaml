apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: create-dot
  name: Create Dot
  description: >
    Writes the Dot sidebar entry for a topology that already exists in the workspace.
    Validates that `topologies/<topology>.yaml` is present, then prints the Dot entry
    on stdout for the consumer app to persist (dots.local.json in the dots app). Does
    NOT author topologies — the Dot Author is required to use `swarmkit author topology`
    (or an already-present topology) BEFORE calling this.

    The target workspace is picked by the AUTHOR_TARGET_WORKSPACE env var (default:
    $CWD/workspace), so one Author instance can serve many consumer apps.
category: capability
inputs:
  type: object
  additionalProperties: false
  required: [id, name, role, greeting, icon, topology]
  properties:
    id:
      type: string
      pattern: "^[a-z][a-z0-9-]*$"
      description: Slug for the Dot (used in the URL and as the entry key).
    name:
      type: string
      description: Human name shown in the sidebar.
    role:
      type: string
      description: One-line description of what this coworker does.
    greeting:
      type: string
      description: The first message the Dot sends the user.
    icon:
      type: string
      description: Icon name (sunrise, mail-reply, github, sparkles, …).
    topology:
      type: string
      description: >
        Name of an existing topology in the target workspace. Must correspond to
        `topologies/<topology>.yaml`.
    renderers:
      type: string
      description: >
        JSON array of renderer names the topology's output matches, e.g.
        '["brief-item"]'. Pass '[]' when none.
      default: "[]"
outputs:
  type: object
  required: [id, dot]
  properties:
    id: { type: string }
    topology_path:
      type: string
      description: Path of the topology file the Dot points at.
    dot:
      type: object
      description: The Dot entry the consumer app should persist.
implementation:
  type: command
  pack: author-tools
  command: create-dot
provenance:
  authored_by: human
  version: 0.2.0
