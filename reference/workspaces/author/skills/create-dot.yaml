apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: create-dot
  name: Create Dot
  description: >
    Registers a Dot. The topology has already been written by `author-topology`
    (bundled SwarmKit authoring agent, #1045); this skill confirms the topology
    file exists in the target workspace and emits the Dot entry on stdout for the
    consumer app to persist (dots.local.json in the dots app). Target workspace path
    comes from AUTHOR_TARGET_WORKSPACE (default: $CWD/workspace).
category: capability
inputs:
  type: object
  additionalProperties: false
  required: [id, name, role, greeting, icon, topology]
  properties:
    id:
      type: string
      pattern: "^[a-z][a-z0-9-]*$"
      description: Slug for the Dot and its topology (same id).
    name:
      type: string
      description: Human name shown in the sidebar.
    role:
      type: string
      description: One-line description of what this coworker does.
    greeting:
      type: string
      description: The first message the Dot sends the user.
    icon:
      type: string
      description: Icon name (sunrise, mail-reply, github, …).
    topology:
      type: string
      description: >
        Id of the topology (metadata.name) the bundled author wrote into
        topologies/<topology>.yaml. The script verifies the file exists before
        registering the Dot — refuses to register against a missing topology.
    renderers:
      type: array
      items: { type: string }
      description: Renderer names the generated topology's output matches (optional).
outputs:
  type: object
  required: [id, topology_path, dot]
  properties:
    id: { type: string }
    topology_path:
      type: string
      description: Path of the written topology file.
    dot:
      type: object
      description: The Dot entry the consumer app should persist.
implementation:
  type: command
  pack: author-tools
  command: create-dot
provenance:
  authored_by: human
  version: 0.1.0
