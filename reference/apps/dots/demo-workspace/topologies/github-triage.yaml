apiVersion: swarmkit/v1
kind: Topology
metadata:
  name: github-triage
  version: 0.2.0
agents:
  root:
    id: root
    role: root
    model:
      provider: openrouter
      name: moonshotai/kimi-k2-0905
      temperature: 0.3
    prompt:
      system: |
        You triage GitHub issues + PRs. Return JSON matching your
        output_schema: three buckets — needs_reply, blocked, ready_to_merge —
        each a list of items with id and one short reason. Omit buckets that
        would be empty.
    output_schema: ../schemas/github-triage.schema.json
