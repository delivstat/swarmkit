# Dots app + a swarmkit serve for the three built-in Dots.
#
# Quickstart:
#   cd reference/apps/dots
#   export SESSION_SECRET="$(openssl rand -hex 32)"
#   export DOTS_OWNER_PASSWORD_HASH="$(printf '%s' 'change-me' | node scripts/hash-password.mjs | tr -d '"')"
#   docker compose up --build
# then open http://localhost:3500 and log in with username=owner password=change-me.
#
# The swarmkit service runs with SWARMKIT_PROVIDER=mock so no API key is needed. Swap it to
# anthropic / openai / ollama when you want real model calls.

services:
  swarmkit:
    build:
      context: ../../..
      dockerfile: reference/apps/dots/Dockerfile.swarmkit
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
      - SWARMKIT_HOST=0.0.0.0
    command:
      - serve
      - /workspace
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      # Compose network is internal (not loopback), but swarmkit refuses by default. For a
      # local-dev reference app with no auth, --insecure is the sanctioned switch. In a
      # real deployment, configure server.auth (api_key/jwt) in the workspace instead.
      - --insecure
    # Shared workspace volume: the swarmkit container and the dots-app container both see
    # the same workspace, so Dots created by the Author (which write a topology YAML there)
    # show up live without a restart.
    volumes:
      - dots-workspace:/workspace
    ports:
      - "8000:8000"
    restart: unless-stopped

  dots-app:
    build: .
    environment:
      - SESSION_SECRET=${SESSION_SECRET:?set SESSION_SECRET to a 32+ char random string}
      - DOTS_OWNER_USERNAME=${DOTS_OWNER_USERNAME:-owner}
      - DOTS_OWNER_PASSWORD_HASH=${DOTS_OWNER_PASSWORD_HASH:?run `node scripts/hash-password.mjs`}
      - SWARMKIT_URL=http://swarmkit:8000
    ports:
      - "3500:3500"
    depends_on:
      - swarmkit
    restart: unless-stopped
    # The dots-app writes Author-created topologies into the shared workspace; swarmkit
    # picks them up without a restart.
    volumes:
      - dots-workspace:/app/workspace

volumes:
  dots-workspace:
