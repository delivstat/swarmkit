# Dots app + a swarmkit serve for the three built-in Dots + the Author Dot.
#
# Quickstart:
#   cd reference/apps/dots
#   export SESSION_SECRET="$(openssl rand -hex 32)"
#   export DOTS_OWNER_PASSWORD_HASH="$(printf '%s' 'change-me' | node scripts/hash-password.mjs | tr -d '"')"
#   export OPENROUTER_API_KEY="sk-or-..."
#   docker compose up --build
# then open http://localhost:3500 and log in with username=owner password=change-me.
#
# All topologies run through Kimi K2 via OpenRouter. Swap the model name in
# demo-workspace/topologies/*.yaml (and in reference/workspaces/author/archetypes/) for a
# different provider.

services:
  # One-shot seed: copy the dots demo workspace + the author workspace into the shared
  # volume so swarmkit serve sees them merged under /workspace. Runs before swarmkit via
  # service_completed_successfully, exits 0, and gets out of the way. Author-created Dots
  # land in the same volume at runtime, so the dots-app and the swarmkit container share
  # /workspace with the live state.
  seed:
    image: alpine:3.19
    volumes:
      - dots-workspace:/out
      - ./demo-workspace:/seed/demo:ro
      - ../../workspaces/author:/seed/author:ro
    # Merge order matters: demo-workspace carries the three Dot topologies + their schemas,
    # the author workspace carries the Author topology + its archetype + command_packs.
    # workspace.yaml from the author workspace wins because it declares the command_packs
    # the Author tools need. We keep demo-workspace's schemas and topologies.
    command:
      - sh
      - -c
      - |
        set -eu
        rm -rf /out/*
        cp -r /seed/demo/. /out/
        for sub in archetypes topologies skills schemas command_packs; do
          if [ -d /seed/author/$sub ]; then
            mkdir -p /out/$sub
            cp -r /seed/author/$sub/. /out/$sub/
          fi
        done
        cp /seed/author/workspace.yaml /out/workspace.yaml
        ls /out /out/topologies
    restart: "no"

  swarmkit:
    build:
      context: ../../..
      dockerfile: reference/apps/dots/Dockerfile.swarmkit
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
      - SWARMKIT_HOST=0.0.0.0
      # The Author's create-dot tool writes new topologies here. Matches the shared mount.
      - AUTHOR_TARGET_WORKSPACE=/workspace
      # Same path, read by the bundled author's write-file / read-workspace scripts (#1045).
      - SWARMKIT_AUTHOR_TARGET_WORKSPACE=/workspace
      # The Author's search-swarmkit-docs tool reads from here. The Dockerfile.swarmkit
      # install includes llms-full.txt via the runtime package data; falls back to the
      # same path inside the container.
      - AUTHOR_LLMS_FULL_PATH=/app/llms-full.txt
      # Where create-dot POSTs the Dot entry so the dots-app persists it in
      # dots.local.json. The dots-app side accepts this on /api/dots/intake.
      - DOTS_INTAKE_URL=http://dots-app:3500/api/dots/intake
      - DOTS_INTAKE_TOKEN=${DOTS_INTAKE_TOKEN:-}
    command:
      - serve
      - /workspace
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      # Compose network is internal (not loopback), but swarmkit refuses by default. For a
      # local-dev reference app with no auth, --insecure is the sanctioned switch. In a
      # real deployment, configure server.auth (api_key/jwt) in the workspace instead.
      - --insecure
      # Browser origins the portal + any dots-app embed/fetch may come from. Includes the
      # local dev port and the Cloudflare hostnames this stack is published through — add
      # or override via SWARMKIT_PUBLIC_DOTS_URL / SWARMKIT_PUBLIC_SERVE_URL in .env.
      - --cors-origin
      - http://127.0.0.1:3509
      - --cors-origin
      - ${SWARMKIT_PUBLIC_DOTS_URL:-https://dots.delivstat.com}
      - --cors-origin
      - ${SWARMKIT_PUBLIC_SERVE_URL:-https://dots-serve.delivstat.com}
    volumes:
      - dots-workspace:/workspace
    ports:
      # Host port 8099 keeps the Cloudflare tunnel wiring stable with the dev-up.sh script.
      - "8099:8000"
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  dots-app:
    build:
      context: ../../..
      dockerfile: reference/apps/dots/Dockerfile
    # IMPORTANT: compose reads .env.docker (NOT .env). The dev `.env` / `.env.local` keep
    # `$$` escapes for @next/env; docker-passed env vars must use literal `$` or the scrypt
    # hash's separators arrive doubled in the container and login silently 401s.
    #
    # Generate it from the dev .env with:
    #   sed 's/\$\$/\$/g' .env > .env.docker
    env_file:
      - .env.docker
    environment:
      - SWARMKIT_URL=http://swarmkit:8000
    ports:
      # Host port 3509 keeps the Cloudflare tunnel wiring stable with the dev-up.sh script.
      - "3509:3500"
    depends_on:
      - swarmkit
    restart: unless-stopped
    volumes:
      - dots-workspace:/app/workspace

volumes:
  dots-workspace:
