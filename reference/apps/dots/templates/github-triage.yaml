# Author Dot template — GitHub triage. See daily-brief.yaml header for the shape.

template:
  id: github-triage
  name: GitHub triage
  summary: A coworker who scans a repo's issues + PRs and tells you what needs attention.
  default_icon: github
  default_role: Issue + PR triage coworker
  default_greeting: Ask me about an issue or PR, or say 'triage inbox'.
  renderers: [github-item]

params:
  - key: repo
    prompt: Which repo? (owner/name — e.g. delivstat/swarmkit)
  - key: labels
    prompt: Which labels should it watch most? (comma-separated — leave blank for all)
    default: ""

topology_template: |
  apiVersion: swarmkit/v1
  kind: Topology
  metadata:
    name: {{dot_id}}
    version: 0.1.0
  agents:
    root:
      id: root
      role: root
      model:
        provider: openrouter
        name: moonshotai/kimi-k2-0905
        temperature: 0.3
      prompt:
        system: |
          Triage GitHub issues and PRs in {{repo}}. Return JSON matching your
          output_schema — three buckets, each a list of items with id and one
          short reason. Omit buckets that would be empty. Prioritise labels: {{labels}}.
      # Structured output boundary — shape mirrors the github-item renderer on the Dot.
      output_schema:
        type: object
        additionalProperties: false
        properties:
          needs_reply:
            type: array
            items: { $ref: "#/$defs/triage_item" }
          blocked:
            type: array
            items: { $ref: "#/$defs/triage_item" }
          ready_to_merge:
            type: array
            items: { $ref: "#/$defs/triage_item" }
        $defs:
          triage_item:
            type: object
            required: [id, reason]
            additionalProperties: false
            properties:
              id: { type: string }
              reason: { type: string }
