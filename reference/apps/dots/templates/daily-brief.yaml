# Author Dot template — Daily brief.
#
# The Author Dot wizard turns a filled version of this manifest into (1) a fresh topology
# YAML under workspace/topologies/{dot_id}.yaml with placeholders substituted, and (2) a
# Dot entry in lib/dots.local.json wired to that topology.
#
# Placeholders use {{snake_case}} syntax; the server-side wizard asks one question per
# `params` entry below and substitutes before writing.

template:
  id: daily-brief
  name: Daily brief
  summary: A coworker who pulls a short brief every morning from the sources you name.
  default_icon: sunrise
  default_role: Daily brief curator
  default_greeting: Ready for today's brief. Shall I pull it?
  renderers: [brief-item]

params:
  - key: sources
    prompt: Which sources should it pull from? (comma-separated — e.g. inbox, calendar, slack)
    default: inbox, calendar
  - key: when
    prompt: When should it run? (free text — e.g. '7am weekdays', 'on demand')
    default: on demand

topology_template: |
  apiVersion: swarmkit/v1
  kind: Topology
  metadata:
    name: {{dot_id}}
    version: 0.1.0
  agents:
    root:
      id: root
      role: root
      model:
        provider: openrouter
        name: moonshotai/kimi-k2-0905
        temperature: 0.3
      prompt:
        system: |
          Pull a short daily brief for the operator. Return JSON matching
          your output_schema — 3 or 4 items + a short follow-up question.
          Sources to consider: {{sources}}. Cadence: {{when}}.
      # Structured output is a boundary contract. SwarmKit validates against this schema,
      # and the dots app renders through brief-item cards. Shape mirrors the renderer.
      output_schema:
        type: object
        required: [items, question]
        additionalProperties: false
        properties:
          items:
            type: array
            minItems: 1
            maxItems: 4
            items:
              type: object
              required: [title, source, reason, action]
              additionalProperties: false
              properties:
                title: { type: string }
                source: { type: string }
                reason: { type: string, description: Under 20 words. }
                action: { type: string, description: The one next step. }
          question:
            type: string
