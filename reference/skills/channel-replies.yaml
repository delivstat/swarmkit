apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: channel-replies
  name: Channel Replies
  description: >
    Messages received on a channel since the last read. Reports supported: false on a send-only
    channel rather than an empty list — "we cannot hear" is a different claim from "nobody
    answered", and reporting the second when the first is true is how a swarm concludes silence.
category: capability
implementation:
  type: mcp_tool
  server: channels
  tool: channel_replies
iam:
  required_scopes: [workspace:read]
provenance:
  authored_by: human
  version: 1.0.0
  requires_runtime: '>=1.206.0'
