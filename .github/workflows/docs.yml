name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "design/details/**"
      - "README.md"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx --from mkdocs-material mkdocs build
      # Every asset the BUILT pages reference must exist. check_docs.py validates the markdown
      # source and cannot see this: MkDocs rewrites markdown paths and leaves raw HTML attributes
      # alone, so a hand-written <video src="img/…"> on a page served at /portal/ 404s.
      - run: python scripts/check_site_assets.py site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
