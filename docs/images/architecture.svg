<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 720" font-family="system-ui, -apple-system, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <title id="t">How SwarmKit works</title>
  <desc id="d">Artifacts are authored conversationally or by hand, resolved and compiled to LangGraph, then executed node by node. Every node runs as a model agent or a coding harness, and every tool call passes one permission seam into governance. Outputs are gated by funnels, recorded in a hash-chained audit trail, and served over CLI, HTTP, MCP and A2A.</desc>
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#b0b0b0" flood-opacity="0.25"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
    <marker id="seam" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="860" height="720" rx="12" fill="#f8fafc"/>
  <text x="430" y="32" text-anchor="middle" fill="#1e293b" font-size="16" font-weight="600">How SwarmKit Works</text>

  <!-- ===== ARTIFACTS ===== -->
  <rect x="40" y="50" width="780" height="88" rx="8" fill="#ecfdf5" stroke="#a7f3d0" filter="url(#shadow)"/>
  <text x="60" y="70" fill="#059669" font-size="11" font-weight="600" letter-spacing="1">ARTIFACTS — YAML/JSON, authored by conversation or by hand</text>
  <rect x="60" y="80" width="140" height="44" rx="6" fill="#fff" stroke="#d1fae5"/>
  <text x="130" y="98" text-anchor="middle" fill="#065f46" font-weight="600" font-size="12">Topology</text>
  <text x="130" y="114" text-anchor="middle" fill="#6b7280" font-size="10">agents + hierarchy</text>
  <rect x="214" y="80" width="140" height="44" rx="6" fill="#fff" stroke="#d1fae5"/>
  <text x="284" y="98" text-anchor="middle" fill="#065f46" font-weight="600" font-size="12">Archetypes · Skills</text>
  <text x="284" y="114" text-anchor="middle" fill="#6b7280" font-size="10">5 skill backings</text>
  <rect x="368" y="80" width="140" height="44" rx="6" fill="#fff" stroke="#d1fae5"/>
  <text x="438" y="98" text-anchor="middle" fill="#065f46" font-weight="600" font-size="12">Funnels · Contracts</text>
  <text x="438" y="114" text-anchor="middle" fill="#6b7280" font-size="10">gates + ordering</text>
  <rect x="522" y="80" width="140" height="44" rx="6" fill="#fff" stroke="#d1fae5"/>
  <text x="592" y="98" text-anchor="middle" fill="#065f46" font-weight="600" font-size="12">Providers · Adapters</text>
  <text x="592" y="114" text-anchor="middle" fill="#6b7280" font-size="10">models + harnesses</text>
  <rect x="676" y="80" width="124" height="44" rx="6" fill="#fff" stroke="#d1fae5"/>
  <text x="738" y="98" text-anchor="middle" fill="#065f46" font-weight="600" font-size="12">EvalSets</text>
  <text x="738" y="114" text-anchor="middle" fill="#6b7280" font-size="10">score + gate CI</text>

  <path d="M430 138 L430 160" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- ===== RUNTIME ===== -->
  <rect x="40" y="166" width="780" height="176" rx="8" fill="#eff6ff" stroke="#bfdbfe" filter="url(#shadow)"/>
  <text x="60" y="186" fill="#1d4ed8" font-size="11" font-weight="600" letter-spacing="1">SWARMKIT RUNTIME — interprets, never generates code</text>

  <rect x="60" y="196" width="170" height="52" rx="6" fill="#fff" stroke="#dbeafe"/>
  <text x="145" y="216" text-anchor="middle" fill="#1e40af" font-weight="600" font-size="12">Resolve</text>
  <text x="145" y="232" text-anchor="middle" fill="#6b7280" font-size="10">merge refs · validate</text>
  <rect x="244" y="196" width="170" height="52" rx="6" fill="#fff" stroke="#dbeafe"/>
  <text x="329" y="216" text-anchor="middle" fill="#1e40af" font-weight="600" font-size="12">Compile</text>
  <text x="329" y="232" text-anchor="middle" fill="#6b7280" font-size="10">YAML → LangGraph</text>
  <rect x="428" y="196" width="170" height="52" rx="6" fill="#fff" stroke="#dbeafe"/>
  <text x="513" y="216" text-anchor="middle" fill="#1e40af" font-weight="600" font-size="12">Execute</text>
  <text x="513" y="232" text-anchor="middle" fill="#6b7280" font-size="10">checkpointed · resumable</text>
  <rect x="612" y="196" width="188" height="52" rx="6" fill="#fff" stroke="#dbeafe"/>
  <text x="706" y="216" text-anchor="middle" fill="#1e40af" font-weight="600" font-size="12">Defer + resume</text>
  <text x="706" y="232" text-anchor="middle" fill="#6b7280" font-size="10">parks on a human gate</text>

  <!-- executors -->
  <text x="60" y="276" fill="#1d4ed8" font-size="10" font-weight="600" letter-spacing="1">EVERY NODE RUNS AS ONE OF TWO EXECUTOR KINDS</text>
  <rect x="60" y="284" width="360" height="44" rx="6" fill="#fff" stroke="#dbeafe"/>
  <text x="240" y="302" text-anchor="middle" fill="#1e40af" font-weight="600" font-size="12">model — a provider call</text>
  <text x="240" y="318" text-anchor="middle" fill="#6b7280" font-size="10">12 bundled providers over 4 wire families</text>
  <rect x="440" y="284" width="360" height="44" rx="6" fill="#fff" stroke="#dbeafe"/>
  <text x="620" y="302" text-anchor="middle" fill="#1e40af" font-weight="600" font-size="12">harness — a coding agent</text>
  <text x="620" y="318" text-anchor="middle" fill="#6b7280" font-size="10">Claude Code · opencode · any JSONL subprocess</text>

  <path d="M430 342 L430 366" stroke="#d97706" stroke-width="2" marker-end="url(#seam)"/>
  <text x="440" y="358" fill="#b45309" font-size="10" font-style="italic">every tool call, both executors</text>

  <!-- ===== GOVERNANCE SEAM ===== -->
  <rect x="40" y="372" width="780" height="92" rx="8" fill="#fffbeb" stroke="#fde68a" filter="url(#shadow)"/>
  <text x="60" y="392" fill="#b45309" font-size="11" font-weight="600" letter-spacing="1">ONE PERMISSION SEAM — evaluate_action() before anything runs</text>
  <rect x="60" y="402" width="180" height="46" rx="6" fill="#fff" stroke="#fef3c7"/>
  <text x="150" y="420" text-anchor="middle" fill="#92400e" font-weight="600" font-size="12">IAM scopes</text>
  <text x="150" y="436" text-anchor="middle" fill="#6b7280" font-size="10">per agent</text>
  <rect x="254" y="402" width="180" height="46" rx="6" fill="#fff" stroke="#fef3c7"/>
  <text x="344" y="420" text-anchor="middle" fill="#92400e" font-weight="600" font-size="12">Skill prerequisites</text>
  <text x="344" y="436" text-anchor="middle" fill="#6b7280" font-size="10">requires: — refuses until called</text>
  <rect x="448" y="402" width="180" height="46" rx="6" fill="#fff" stroke="#fef3c7"/>
  <text x="538" y="420" text-anchor="middle" fill="#92400e" font-weight="600" font-size="12">MCP tiers</text>
  <text x="538" y="436" text-anchor="middle" fill="#6b7280" font-size="10">open · cautious · strict · readonly</text>
  <rect x="642" y="402" width="158" height="46" rx="6" fill="#fff" stroke="#fef3c7"/>
  <text x="721" y="420" text-anchor="middle" fill="#92400e" font-weight="600" font-size="12">Sandbox</text>
  <text x="721" y="436" text-anchor="middle" fill="#6b7280" font-size="10">worktree · container</text>

  <path d="M430 464 L430 488" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- ===== GATES + RECORD ===== -->
  <rect x="40" y="494" width="780" height="92" rx="8" fill="#faf5ff" stroke="#e9d5ff" filter="url(#shadow)"/>
  <text x="60" y="514" fill="#7e22ce" font-size="11" font-weight="600" letter-spacing="1">GATES AND THE RECORD</text>
  <rect x="60" y="524" width="240" height="46" rx="6" fill="#fff" stroke="#f3e8ff"/>
  <text x="180" y="542" text-anchor="middle" fill="#6b21a8" font-weight="600" font-size="12">Funnel → human approval</text>
  <text x="180" y="558" text-anchor="middle" fill="#6b7280" font-size="10">quorum · distinct approvers</text>
  <rect x="314" y="524" width="240" height="46" rx="6" fill="#fff" stroke="#f3e8ff"/>
  <text x="434" y="542" text-anchor="middle" fill="#6b21a8" font-weight="600" font-size="12">Hash-chained audit</text>
  <text x="434" y="558" text-anchor="middle" fill="#6b7280" font-size="10">append-only, every step</text>
  <rect x="568" y="524" width="232" height="46" rx="6" fill="#fff" stroke="#f3e8ff"/>
  <text x="684" y="542" text-anchor="middle" fill="#6b21a8" font-weight="600" font-size="12">Traces · memory · artifacts</text>
  <text x="684" y="558" text-anchor="middle" fill="#6b7280" font-size="10">OTel · governed recall</text>

  <path d="M430 586 L430 610" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- ===== SURFACES ===== -->
  <rect x="40" y="616" width="780" height="76" rx="8" fill="#f1f5f9" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="60" y="636" fill="#475569" font-size="11" font-weight="600" letter-spacing="1">ONE RUN, FIVE FRONT DOORS — same services, same gates, same audit</text>
  <rect x="60" y="646" width="140" height="34" rx="6" fill="#fff" stroke="#e2e8f0"/>
  <text x="130" y="668" text-anchor="middle" fill="#334155" font-size="12">CLI</text>
  <rect x="214" y="646" width="140" height="34" rx="6" fill="#fff" stroke="#e2e8f0"/>
  <text x="284" y="668" text-anchor="middle" fill="#334155" font-size="12">HTTP + portal</text>
  <rect x="368" y="646" width="140" height="34" rx="6" fill="#fff" stroke="#e2e8f0"/>
  <text x="438" y="668" text-anchor="middle" fill="#334155" font-size="12">MCP</text>
  <rect x="522" y="646" width="140" height="34" rx="6" fill="#fff" stroke="#e2e8f0"/>
  <text x="592" y="668" text-anchor="middle" fill="#334155" font-size="12">A2A</text>
  <rect x="676" y="646" width="124" height="34" rx="6" fill="#fff" stroke="#e2e8f0"/>
  <text x="738" y="668" text-anchor="middle" fill="#334155" font-size="12">Fleet panel</text>
</svg>
